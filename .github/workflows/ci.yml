name: Unity TV CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Checking
        run: npx tsc --noEmit

      - name: Build Next.js Production Artifacts
        run: npm run build
        env:
          AUTH_SECRET: "ci-dummy-auth-secret-key-32-chars-long"
          WHISTLEBLOWER_ENCRYPTION_KEY: "e4d3c2b1a09876543210fedcba9876543210fedcba9876543210fedcba987654"
          SEED_ADMIN_PASSWORD: "ci-test-password"
          NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
