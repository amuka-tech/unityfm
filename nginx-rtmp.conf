# ==============================================================================
# Unity TV Uganda — Standalone Nginx-RTMP Media Server & Ephemeral HLS Ingest
# ==============================================================================
# - Strictly NO RECORDINGS (record off)
# - Dynamic Database Auth Webhook (on_publish -> Next.js /api/auth-stream)
# - Ephemeral in-memory HLS ring buffer (/tmp/hls, 10s playlist, hls_cleanup on)
# ==============================================================================

worker_processes auto;
events {
    worker_connections 1024;
}

# ------------------------------------------------------------------------------
# 1. RTMP Ingest Core (vMix / OBS Direct Connection)
# ------------------------------------------------------------------------------
rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        ping 30s;
        notify_method post;

        application live {
            live on;

            # 1. STRICTLY DISABLE RECORDINGS (Zero VOD / zero disk retention)
            record off;

            # 2. AUTHENTICATION WEBHOOK
            # Nginx pauses and sends POST request with stream key to Unity TV website
            on_publish http://127.0.0.1:3000/api/auth-stream;

            # 3. EPHEMERAL LOW-LATENCY HLS CHUNKS (In-RAM /tmp directory)
            hls on;
            hls_path /tmp/hls;
            hls_fragment 2s;
            hls_playlist_length 10s;
            
            # Instantly purge temporary chunk files the second vMix stops streaming
            hls_cleanup on;
            hls_nested on;
        }
    }
}

# ------------------------------------------------------------------------------
# 2. HTTP Server & HLS Delivery to Web Viewers
# ------------------------------------------------------------------------------
http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name stream.unitytv.ug;

        # Serve ephemeral live HLS stream fragments (.m3u8 and .ts)
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /tmp;
            
            # Disable HTTP caching for live ephemeral video
            add_header Cache-Control no-cache;

            # CORS Headers for web browsers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Range, Origin, Content-Type, Accept' always;
        }

        # Reverse Proxy to Next.js Web Application
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
